<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vinuta · Painel de Avaliações</title>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="firebase-config.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,400&family=Cinzel:wght@500;600&family=EB+Garamond:ital@0;1&display=swap');

  :root{
    --wine-900:#3a0d17;
    --wine-800:#4c1220;
    --gold:#b8935a;
    --gold-light:#d4b483;
    --cream:#f4ede2;
    --ink:#2b1912;
    --ink-soft:#6b5c50;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:radial-gradient(120% 100% at 50% 0%, #efe6d8 0%, #e2d6c3 55%, #d8c9b2 100%);
    font-family:'EB Garamond', serif;
    color:var(--ink);
    min-height:100vh;
    padding:28px 16px 60px;
  }

  .wrap{ max-width:760px; margin:0 auto; }

  /* ---------- LOGIN ---------- */
  #loginScreen{
    max-width:380px;
    margin:60px auto;
    background:var(--cream);
    border-radius:14px;
    padding:36px 30px;
    box-shadow:0 30px 60px -20px rgba(58,13,23,0.35), 0 0 0 1px rgba(184,147,90,0.25);
    text-align:center;
  }
  #loginScreen h1{
    font-family:'Cormorant Garamond', serif;
    font-size:24px;
    color:var(--wine-900);
    margin:0 0 4px;
  }
  #loginScreen p{
    font-size:13px;
    color:var(--ink-soft);
    font-style:italic;
    margin:0 0 24px;
  }
  #loginScreen input{
    width:100%;
    background:#fbf8f1;
    border:1px solid #e2d3ba;
    border-radius:4px;
    padding:13px 14px;
    font-family:'EB Garamond', serif;
    font-size:14px;
    margin-bottom:12px;
    outline:none;
  }
  #loginScreen input:focus{ border-color:var(--gold); }
  #loginScreen button{
    width:100%;
    background:linear-gradient(180deg, #4c1220 0%, #380c15 100%);
    color:var(--cream);
    border:1px solid rgba(212,180,131,0.4);
    border-radius:4px;
    padding:13px;
    font-family:'Cinzel',serif;
    font-size:11.5px;
    letter-spacing:2.5px;
    font-weight:600;
    cursor:pointer;
    margin-top:6px;
  }
  #loginError{
    color:#a33b3b;
    font-size:12px;
    margin-top:12px;
    min-height:14px;
    font-style:italic;
  }

  /* ---------- DASHBOARD ---------- */
  #dashboard{ display:none; }

  header.top{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:24px;
    flex-wrap:wrap;
    gap:10px;
  }
  header.top h1{
    font-family:'Cinzel', serif;
    font-size:18px;
    letter-spacing:2px;
    color:var(--wine-900);
    margin:0;
  }
  header.top .sub{
    font-size:11px;
    letter-spacing:1px;
    color:var(--ink-soft);
  }
  #logoutBtn{
    background:none;
    border:1px solid #c9b190;
    color:var(--wine-900);
    padding:8px 16px;
    border-radius:4px;
    font-family:'EB Garamond', serif;
    font-size:12.5px;
    cursor:pointer;
  }
  #logoutBtn:hover{ background:#fbf3e6; }

  /* Access cards */
  .access-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
    margin-bottom:26px;
  }
  @media (max-width:520px){ .access-grid{ grid-template-columns:1fr; } }
  .access-card{
    background:var(--cream);
    border:1px solid #e8dcc4;
    border-radius:10px;
    padding:18px;
    text-align:center;
  }
  .access-card h3{
    font-family:'Cormorant Garamond', serif;
    font-size:16px;
    color:var(--wine-900);
    margin:0 0 10px;
  }
  .access-card img{
    width:130px; height:130px;
    border-radius:6px;
    border:1px solid #e8dcc4;
    margin-bottom:10px;
  }
  .access-card .link{
    display:block;
    font-size:11px;
    color:var(--ink-soft);
    word-break:break-all;
    margin-bottom:8px;
  }
  .access-card button{
    background:none;
    border:1px solid var(--gold);
    color:var(--wine-900);
    padding:6px 14px;
    border-radius:4px;
    font-size:11px;
    letter-spacing:1px;
    font-family:'Cinzel', serif;
    cursor:pointer;
  }
  .access-card button:hover{ background:#fbf3e6; }

  /* Stats */
  .stats{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:14px;
    margin-bottom:26px;
  }
  @media (max-width:520px){ .stats{ grid-template-columns:1fr; } }
  .stat-card{
    background:var(--cream);
    border:1px solid #e8dcc4;
    border-radius:10px;
    padding:18px;
    text-align:center;
  }
  .stat-card .num{
    font-family:'Cormorant Garamond', serif;
    font-size:32px;
    color:var(--wine-900);
    font-weight:600;
  }
  .stat-card .label{
    font-size:11.5px;
    color:var(--ink-soft);
    letter-spacing:.5px;
    margin-top:2px;
  }

  /* List */
  .list-title{
    font-family:'Cormorant Garamond', serif;
    font-size:19px;
    color:var(--wine-900);
    margin:0 0 14px;
  }
  .entry{
    background:var(--cream);
    border:1px solid #e8dcc4;
    border-radius:10px;
    padding:16px 18px;
    margin-bottom:12px;
  }
  .entry-top{
    display:flex; justify-content:space-between; align-items:flex-start;
    gap:10px;
    margin-bottom:6px;
  }
  .entry-name{
    font-family:'Cormorant Garamond', serif;
    font-size:17px;
    font-weight:600;
    color:var(--wine-900);
  }
  .entry-date{
    font-size:11px;
    color:#a89a89;
    white-space:nowrap;
  }
  .entry-phone{
    font-size:12.5px;
    color:var(--ink-soft);
    margin-bottom:8px;
  }
  .entry-glasses{ display:flex; gap:3px; margin-bottom:8px; }
  .entry-glasses svg{ width:16px; height:20px; }
  .entry-comment{
    font-size:13.5px;
    color:var(--ink);
    font-style:italic;
    line-height:1.5;
    border-left:2px solid var(--gold-light);
    padding-left:10px;
  }
  .empty-state, .loading-state{
    text-align:center;
    color:var(--ink-soft);
    font-style:italic;
    padding:40px 0;
  }
</style>
</head>
<body>

<div id="loginScreen">
  <h1>Painel Vinuta</h1>
  <p>Acesso restrito às avaliações da experiência.</p>
  <input type="email" id="loginEmail" placeholder="E-mail" autocomplete="username">
  <input type="password" id="loginPass" placeholder="Senha" autocomplete="current-password">
  <button id="loginBtn">ENTRAR</button>
  <p id="loginError"></p>
</div>

<div id="dashboard" class="wrap">
  <header class="top">
    <div>
      <h1>VINUTA</h1>
      <div class="sub">Painel de Avaliações</div>
    </div>
    <button id="logoutBtn">Sair</button>
  </header>

  <div class="access-grid">
    <div class="access-card">
      <h3>Link para avaliar</h3>
      <img id="qrGuest" src="" alt="QR code do formulário">
      <span class="link" id="linkGuest"></span>
      <button onclick="copyLink('linkGuest')">Copiar link</button>
    </div>
    <div class="access-card">
      <h3>Link deste painel</h3>
      <img id="qrAdmin" src="" alt="QR code do painel">
      <span class="link" id="linkAdmin"></span>
      <button onclick="copyLink('linkAdmin')">Copiar link</button>
    </div>
  </div>

  <div class="stats">
    <div class="stat-card">
      <div class="num" id="statTotal">0</div>
      <div class="label">AVALIAÇÕES</div>
    </div>
    <div class="stat-card">
      <div class="num" id="statAvg">0.0</div>
      <div class="label">MÉDIA GERAL</div>
    </div>
    <div class="stat-card">
      <div class="num" id="statToday">0</div>
      <div class="label">HOJE</div>
    </div>
  </div>

  <h2 class="list-title">Últimas avaliações</h2>
  <div id="list"><div class="loading-state">Carregando...</div></div>
</div>

<script>
  // ---------- Access cards: build links + QR codes from current URL ----------
  const base = window.location.href.replace(/admin\.html.*$/, '');
  const guestLink = base + 'index.html';
  const adminLink = base + 'admin.html';
  document.getElementById('linkGuest').textContent = guestLink;
  document.getElementById('linkAdmin').textContent = adminLink;
  document.getElementById('qrGuest').src = 'https://api.qrserver.com/v1/create-qr-code/?size=260x260&color=58-13-23&data=' + encodeURIComponent(guestLink);
  document.getElementById('qrAdmin').src = 'https://api.qrserver.com/v1/create-qr-code/?size=260x260&color=58-13-23&data=' + encodeURIComponent(adminLink);

  function copyLink(id){
    const text = document.getElementById(id).textContent;
    navigator.clipboard.writeText(text);
  }

  // ---------- Auth ----------
  const loginScreen = document.getElementById('loginScreen');
  const dashboard = document.getElementById('dashboard');
  const loginBtn = document.getElementById('loginBtn');
  const loginError = document.getElementById('loginError');

  loginBtn.addEventListener('click', async () => {
    const email = document.getElementById('loginEmail').value.trim();
    const pass = document.getElementById('loginPass').value;
    loginError.textContent = '';
    try {
      await auth.signInWithEmailAndPassword(email, pass);
    } catch (err) {
      loginError.textContent = 'E-mail ou senha inválidos.';
    }
  });

  document.getElementById('logoutBtn').addEventListener('click', () => auth.signOut());

  auth.onAuthStateChanged(user => {
    if (user) {
      loginScreen.style.display = 'none';
      dashboard.style.display = 'block';
      startListening();
    } else {
      loginScreen.style.display = 'block';
      dashboard.style.display = 'none';
    }
  });

  // ---------- Data ----------
  const glassIcon = (filled) => `
    <svg viewBox="0 0 34 46" xmlns="http://www.w3.org/2000/svg">
      <path d="M7 3 C7 3 6 15 17 15 C28 15 27 3 27 3 Z" fill="${filled ? '#6e1424' : 'none'}" stroke="${filled ? '#4c1220' : '#c9b190'}" stroke-width="1.6"/>
      <line x1="17" y1="15" x2="17" y2="34" stroke="${filled ? '#4c1220' : '#c9b190'}" stroke-width="1.6"/>
      <line x1="9" y1="40" x2="25" y2="40" stroke="${filled ? '#4c1220' : '#c9b190'}" stroke-width="1.6" stroke-linecap="round"/>
      <line x1="17" y1="34" x2="17" y2="40" stroke="${filled ? '#4c1220' : '#c9b190'}" stroke-width="1.6"/>
    </svg>`;

  let started = false;
  function startListening(){
    if (started) return;
    started = true;
    db.collection('avaliacoes').orderBy('criadoEm', 'desc').onSnapshot(snapshot => {
      const docs = snapshot.docs.map(d => d.data());
      renderStats(docs);
      renderList(docs);
    }, err => {
      document.getElementById('list').innerHTML = '<div class="empty-state">Não foi possível carregar as avaliações.</div>';
      console.error(err);
    });
  }

  function renderStats(docs){
    const total = docs.length;
    const avg = total ? (docs.reduce((s,d) => s + (d.rating||0), 0) / total) : 0;
    const todayStr = new Date().toDateString();
    const today = docs.filter(d => d.criadoEm && d.criadoEm.toDate().toDateString() === todayStr).length;

    document.getElementById('statTotal').textContent = total;
    document.getElementById('statAvg').textContent = avg.toFixed(1);
    document.getElementById('statToday').textContent = today;
  }

  function renderList(docs){
    const list = document.getElementById('list');
    if (!docs.length){
      list.innerHTML = '<div class="empty-state">Nenhuma avaliação recebida ainda.</div>';
      return;
    }
    list.innerHTML = docs.map(d => {
      const date = d.criadoEm ? d.criadoEm.toDate().toLocaleString('pt-BR') : '—';
      const glasses = [1,2,3,4,5].map(i => glassIcon(i <= (d.rating||0))).join('');
      return `
        <div class="entry">
          <div class="entry-top">
            <span class="entry-name">${escapeHtml(d.nome || 'Sem nome')}</span>
            <span class="entry-date">${date}</span>
          </div>
          ${d.telefone ? `<div class="entry-phone">${escapeHtml(d.telefone)}</div>` : ''}
          <div class="entry-glasses">${glasses}</div>
          ${d.comentario ? `<div class="entry-comment">${escapeHtml(d.comentario)}</div>` : ''}
        </div>`;
    }).join('');
  }

  function escapeHtml(str){
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }
</script>

</body>
</html>
